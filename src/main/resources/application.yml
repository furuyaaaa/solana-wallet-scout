spring:
  datasource:
    url: jdbc:h2:mem:wallet_scout;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
helius:
  rpc-url: https://mainnet.helius-rpc.com
  api-key: ${HELIUS_API_KEY:}
scout:
  early-window-minutes: 180
  max-transactions-per-token: 2000
